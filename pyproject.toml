[project]
name = "fake-headline-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "bitsandbytes>=0.50.2",
    "bs4>=0.0.2",
    "datasets>=5.0.1",
    "firecrawl-py>=4.34.0",
    "matplotlib>=3.11.2",
    "nest-asyncio>=1.6.0",
    "numpy>=2.5.2",
    "openai>=3.6.0",
    "openai-agents>=0.22.0",
    "pandas>=3.0.5",
    "peft>=0.21.0",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "trl>=1.13.0",
    "torch==2.14.0",
]

[dependency-groups]
dev = [
    "ipykernel<7",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true